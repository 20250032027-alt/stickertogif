<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderation - StickerToGIF</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
</head>
<body>

<div class="page-with-history">
  <div class="converter-col">
    <header>
      <a class="logo" href="/">
        <div class="logo-icon"><img src="/logo.png" alt="StickerToGIF logo" /></div>
        <span class="logo-text">sticker<span>to</span>gif</span>
      </a>
      <nav>
        <a href="/">Convert</a>
        <a href="/gallery.html">Gallery</a>
      </nav>
    </header>

    <main id="main-content">
      <div class="hero">
        <div class="badge">moderation</div>
        <h1 style="font-size:32px">Review Queue</h1>
      </div>

      <!-- Login -->
      <div class="card" id="login-card">
        <div class="card-header-row"><span class="input-label">SIGN IN</span></div>
        <form id="login-form" style="display:flex;flex-direction:column;gap:10px" onsubmit="doLogin(event)">
          <input type="email" id="login-email" class="slot-url" placeholder="Email" required />
          <input type="password" id="login-password" class="slot-url" placeholder="Password" required />
          <button type="submit" class="convert-all-btn" style="align-self:flex-start">Sign in →</button>
          <div id="login-error" style="color:var(--accent2);font-size:12px;font-family:'DM Mono',monospace;display:none"></div>
        </form>
      </div>

      <!-- Dashboard, hidden until authenticated as an admin -->
      <div id="dashboard" style="display:none">
        <div class="card-header-row" style="margin-bottom:16px">
          <span class="input-label">PENDING REVIEW &amp; REPORTED</span>
          <button class="add-btn" onclick="signOut()">Sign out</button>
        </div>
        <div id="queue-status" style="color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;margin-bottom:10px"></div>
        <div id="batch-bar" style="display:none;align-items:center;gap:12px;margin-bottom:16px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">
            <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll()" />
            Select all
          </label>
          <span id="batch-count" style="font-family:'DM Mono',monospace;font-size:12px;color:var(--accent);flex:1">0 selected</span>
          <button class="dl-btn" onclick="approveSelected()">Approve selected</button>
          <button class="convert-btn" onclick="hideSelected()">Hide selected</button>
        </div>
        <div id="queue-list"></div>

        <div class="card-header-row" style="margin:40px 0 16px">
          <span class="input-label">PUBLISHED STICKERS</span>
        </div>
        <input id="published-search" type="text" class="slot-url" style="width:100%;margin-bottom:16px" placeholder="Search published stickers by name or tag..." oninput="filterPublished()" />
        <div id="published-status" style="color:var(--muted);font-family:'DM Mono',monospace;font-size:13px;margin-bottom:16px"></div>
        <div id="published-list"></div>
      </div>
    </main>
  </div>
</div>

<script>
  const { createClient } = supabase;
  const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  async function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      return;
    }
    checkAuth();
  }

  async function signOut() {
    await db.auth.signOut();
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-card').style.display = 'block';
  }

  async function checkAuth() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) return;
    // Row Level Security only returns rows if this user is actually in
    // the admins table (see schema.sql) - a non-admin login just sees
    // an empty queue, it can't see or touch anyone else's data.
    document.getElementById('login-card').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadQueue();
    loadPublished();
  }

  // Builds one editable row: image, name input, tags input, report
  // details (if any), and action buttons. Used for both the review
  // queue and the published-stickers list below it. showCheckbox is
  // only true in the queue, where batch-approve needs something to
  // select.
  async function buildStickerRow(item, showCheckbox) {
    const { data: reports } = await db.from('reports').select('reason, details, created_at').eq('sticker_id', item.id);
    const { data: urlData } = db.storage.from('stickers').getPublicUrl(item.storage_path);
    const row = document.createElement('div');
    row.className = 'slot';
    row.dataset.id = item.id;
    const reportLines = (reports || []).map(r => `<div style="font-size:11px;color:var(--muted)">- ${r.reason}${r.details ? ': ' + r.details : ''}</div>`).join('');
    const approveBtn = item.status !== 'published'
      ? `<button class="dl-btn" onclick="setStatus('${item.id}','published')">Approve</button>`
      : '';
    const checkbox = showCheckbox
      ? `<input type="checkbox" class="queue-select-checkbox" data-id="${item.id}" onclick="handleQueueCheckboxClick(event)" style="margin-right:10px;flex-shrink:0" />`
      : '';
    row.innerHTML = `
      <div class="slot-top">
        <div class="slot-name-wrap" style="flex:1;display:flex;align-items:center">
          ${checkbox}
          <input id="name-input-${item.id}" class="slot-url" style="font-family:'Syne',sans-serif;font-weight:700;max-width:260px" value="${item.name}" />
          <span class="gif-ext" style="margin-left:10px">status: ${item.status}, ${item.report_count} report(s)</span>
        </div>
      </div>
      <div class="slot-body">
        <div class="slot-preview-wrap"><img src="${urlData.publicUrl}" style="width:100%;height:100%;object-fit:contain" /></div>
        <div class="slot-right">
          <input id="tags-input-${item.id}" class="slot-url" placeholder="tags, comma separated" value="${(item.tags || []).join(', ')}" />
          ${reportLines}
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
            <button class="add-btn" onclick="saveEdits('${item.id}')">Save changes</button>
            ${approveBtn}
            <button class="convert-btn" onclick="setStatus('${item.id}','hidden')">Hide</button>
            <button class="slot-report-btn" onclick="removeSticker('${item.id}')">Remove permanently</button>
          </div>
          <span id="save-status-${item.id}" class="slot-status"></span>
        </div>
      </div>`;
    return row;
  }

  async function loadQueue() {
    const statusEl = document.getElementById('queue-status');
    const listEl = document.getElementById('queue-list');
    statusEl.textContent = 'Loading...';
    const { data, error } = await db
      .from('stickers')
      .select('id, name, tags, storage_path, status, report_count, created_at')
      .in('status', ['pending_review', 'hidden'])
      .order('created_at', { ascending: false });

    if (error) {
      statusEl.textContent = 'Could not load the queue. Are you in the admins table? See SETUP.md.';
      return;
    }
    updateQueueStatusText(data.length);
    listEl.innerHTML = '';
    document.getElementById('batch-bar').style.display = data.length ? 'flex' : 'none';
    document.getElementById('select-all-checkbox').checked = false;
    for (const item of data) {
      listEl.appendChild(await buildStickerRow(item, true));
    }
    updateBatchBar();
  }

  function updateQueueStatusText(count) {
    const statusEl = document.getElementById('queue-status');
    statusEl.textContent = count > 0 ? count + ' item(s) waiting on review.' : 'Nothing waiting on review right now.';
  }

  // Removes a row from the DOM directly instead of re-fetching and
  // re-rendering the whole list - this is what actually fixes the
  // "everything refreshes" feeling after a single action. Works out
  // which list the row came from so it updates the right counter.
  function removeRowFromDOM(id) {
    const row = document.querySelector(`.slot[data-id="${id}"]`);
    if (!row) return;
    const inQueue = !!row.closest('#queue-list');
    const inPublished = !!row.closest('#published-list');
    row.style.transition = 'opacity 0.2s, transform 0.2s';
    row.style.opacity = '0';
    row.style.transform = 'scale(0.98)';
    setTimeout(() => {
      row.remove();
      if (inQueue) {
        const remaining = document.getElementById('queue-list').children.length;
        updateQueueStatusText(remaining);
        document.getElementById('batch-bar').style.display = remaining ? 'flex' : 'none';
        updateBatchBar();
      }
      if (inPublished) {
        allPublished = allPublished.filter(s => s.id !== id);
        document.getElementById('published-status').textContent = allPublished.length + ' published sticker(s).';
      }
    }, 200);
  }

  // Shift-click range select: click one checkbox, hold Shift and
  // click another further down, and everything in between gets set
  // to match. Plain clicks (no Shift) work exactly as before -
  // toggling just that one row - and become the new starting point
  // for the next range.
  let lastClickedQueueCheckbox = null;

  function handleQueueCheckboxClick(e) {
    const checkboxes = Array.from(document.querySelectorAll('.queue-select-checkbox'));
    const clicked = e.target;
    if (e.shiftKey && lastClickedQueueCheckbox && checkboxes.includes(lastClickedQueueCheckbox)) {
      const startIdx = checkboxes.indexOf(lastClickedQueueCheckbox);
      const endIdx = checkboxes.indexOf(clicked);
      const [from, to] = startIdx < endIdx ? [startIdx, endIdx] : [endIdx, startIdx];
      const shouldCheck = clicked.checked;
      for (let i = from; i <= to; i++) checkboxes[i].checked = shouldCheck;
    }
    lastClickedQueueCheckbox = clicked;
    updateBatchBar();
  }

  function getSelectedIds() {
    return Array.from(document.querySelectorAll('.queue-select-checkbox:checked')).map(cb => cb.dataset.id);
  }

  function updateBatchBar() {
    const count = getSelectedIds().length;
    document.getElementById('batch-count').textContent = count + ' selected';
    const allBoxes = document.querySelectorAll('.queue-select-checkbox');
    document.getElementById('select-all-checkbox').checked = allBoxes.length > 0 && count === allBoxes.length;
  }

  function toggleSelectAll() {
    const checked = document.getElementById('select-all-checkbox').checked;
    document.querySelectorAll('.queue-select-checkbox').forEach(cb => { cb.checked = checked; });
    updateBatchBar();
  }

  async function approveSelected() {
    const ids = getSelectedIds();
    if (!ids.length) return;
    const { error } = await db.from('stickers').update({ status: 'published', report_count: 0 }).in('id', ids);
    if (error) { alert('Batch approve failed: ' + error.message); return; }
    ids.forEach(id => removeRowFromDOM(id));
    loadPublished();
  }

  async function hideSelected() {
    const ids = getSelectedIds();
    if (!ids.length) return;
    const { error } = await db.from('stickers').update({ status: 'hidden' }).in('id', ids);
    if (error) { alert('Batch hide failed: ' + error.message); return; }
    ids.forEach(id => removeRowFromDOM(id));
  }

  let allPublished = [];

  async function loadPublished() {
    const statusEl = document.getElementById('published-status');
    statusEl.textContent = 'Loading...';
    const { data, error } = await db
      .from('stickers')
      .select('id, name, tags, storage_path, status, report_count, created_at')
      .eq('status', 'published')
      .order('created_at', { ascending: false });

    if (error) {
      statusEl.textContent = 'Could not load published stickers.';
      return;
    }
    allPublished = data || [];
    statusEl.textContent = allPublished.length + ' published sticker(s).';
    renderPublished(allPublished);
  }

  async function renderPublished(items) {
    const listEl = document.getElementById('published-list');
    listEl.innerHTML = '';
    if (!items.length) {
      listEl.innerHTML = '<div class="history-empty">No published stickers match.</div>';
      return;
    }
    for (const item of items) {
      listEl.appendChild(await buildStickerRow(item, false));
    }
  }

  function filterPublished() {
    const q = document.getElementById('published-search').value.trim().toLowerCase();
    if (!q) { renderPublished(allPublished); return; }
    const filtered = allPublished.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.tags || []).some(t => t.toLowerCase().includes(q))
    );
    renderPublished(filtered);
  }

  async function saveEdits(id) {
    const nameInput = document.getElementById('name-input-' + id);
    const tagsInput = document.getElementById('tags-input-' + id);
    const saveStatus = document.getElementById('save-status-' + id);
    const name = nameInput.value.trim();
    const tags = tagsInput.value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
    if (!name) { saveStatus.textContent = 'Name can\'t be empty.'; saveStatus.style.color = 'var(--accent2)'; return; }
    const { error } = await db.from('stickers').update({ name, tags }).eq('id', id);
    if (error) { saveStatus.textContent = 'Save failed: ' + error.message; saveStatus.style.color = 'var(--accent2)'; return; }
    saveStatus.textContent = 'Saved.';
    saveStatus.style.color = 'var(--accent)';
    setTimeout(() => { saveStatus.textContent = ''; }, 2500);
  }

  // Single-item status change. Removes just that one row locally
  // instead of reloading and rebuilding the entire queue/published
  // list - only refreshes the *other* list, and only when it
  // actually needs to (e.g. approving means it should now show up
  // in Published).
  async function setStatus(id, status) {
    const { error } = await db.from('stickers').update({ status, report_count: status === 'published' ? 0 : undefined }).eq('id', id);
    if (error) { alert('Update failed: ' + error.message); return; }
    removeRowFromDOM(id);
    if (status === 'published') loadPublished();
  }

  async function removeSticker(id) {
    if (!confirm('Permanently remove this sticker? This cannot be undone.')) return;
    const { error } = await db.from('stickers').update({ status: 'removed' }).eq('id', id);
    if (error) { alert('Remove failed: ' + error.message); return; }
    removeRowFromDOM(id);
  }

  checkAuth();
</script>
</body>
</html>
