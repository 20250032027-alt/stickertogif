  // ── Bulletproof IndexedDB Storage (Safely upgrades v2 schema on the fly) ──
  let db = null;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('stickertogif_v2', 2); // bumped version to 2 to safely trigger auto-upgrade for folders
      
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('gifs')) {
          const store = d.createObjectStore('gifs', { keyPath: 'id', autoIncrement: true });
          store.createIndex('ts', 'ts', { unique: false });
        }
        if (!d.objectStoreNames.contains('folders')) {
          d.createObjectStore('folders', { keyPath: 'name' });
        }
      };

      req.onsuccess = e => { db = e.target.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }

  async function getStoredFolders() {
    if (!db) await openDB();
    return new Promise(resolve => {
      try {
        const tx = db.transaction('folders', 'readonly');
        const store = tx.objectStore('folders');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.map(f => f.name));
        req.onerror = () => resolve([]);
      } catch(err) {
        resolve([]); // Fallback if store is missing
      }
    });
  }

  async function loadFoldersToUI() {
    const folders = await getStoredFolders();
    const container = document.getElementById('folder-tabs-container');
    container.innerHTML = `
      <button class="folder-tab ${currentFolderView === 'All' ? 'active' : ''}" onclick="switchFolder('All')">History</button>
      ${folders.map(f => `<button class="folder-tab ${currentFolderView === f ? 'active' : ''}" onclick="switchFolder('${f}')">${f}</button>`).join('')}

    `;
    loadHistory();
  }

  async function createNewFolder() {
    const name = prompt('Enter new folder name:');
    if (!name || !name.trim()) return;
    const cleanName = name.trim();
    if (!db) await openDB();
    const tx = db.transaction('folders', 'readwrite');
    tx.objectStore('folders').put({ name: cleanName });
    tx.oncomplete = () => loadFoldersToUI();
  }

  async function saveToHistory(blob, name) {
    if (!db) await openDB();
    const thumb = await makeThumbnail(blob);
    return new Promise((resolve, reject) => {
      const tx = db.transaction('gifs', 'readwrite');
      tx.objectStore('gifs').add({
        blob, thumb, name,
        folder: 'All',
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        ts: Date.now()
      });
      tx.oncomplete = () => { loadHistory(); resolve(); };
      tx.onerror = () => reject(tx.error);
    });
  }

  function makeThumbnail(blob) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 80; c.height = 80;
        const ctx = c.getContext('2d');
        const s = Math.min(80/img.width, 80/img.height);
        const dw = img.width*s, dh = img.height*s;
        ctx.drawImage(img, (80-dw)/2, (80-dh)/2, dw, dh);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/png', 0.6));
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(''); };
      img.src = url;
    });
  }

  async function loadHistory() {
    if (!db) await openDB();
    const tx = db.transaction('gifs', 'readonly');
    const req = tx.objectStore('gifs').getAll();
    req.onsuccess = async () => {
      const items = req.result.sort((a, b) => b.ts - a.ts);
      const folders = await getStoredFolders();
      renderHistoryItems(items, folders);
    };
  }

  async function renderHistoryItems(items, folders) {
    const grid = document.getElementById('history-grid');
    const query = document.getElementById('history-search').value.toLowerCase().trim();
    
    let filtered = items.filter(item => {
      const matchFolder = (currentFolderView === 'All') || (item.folder === currentFolderView);
      const matchQuery = !query || (item.name && item.name.toLowerCase().includes(query));
      return matchFolder && matchQuery;
    });

    grid.innerHTML = '';
    if (!filtered.length) {
      grid.innerHTML = `<div class="history-empty">No items found.</div>`;
      return;
    }

    for (const item of filtered) {
      const card = document.createElement('div');
      card.className = 'history-card';
      
      const itemName = item.name || 'sticker';
      const folderOptions = ['All', ...folders].map(f => `<option value="${f}" ${(item.folder || 'All') === f ? 'selected' : ''}>${f}</option>`).join('');

      card.innerHTML = `
        <img class="history-thumb" src="${item.thumb}" alt="${itemName}" />
        <div class="history-info" style="min-width:0; flex:1;">
          <div class="history-name-editable" title="Click to rename" onclick="renameHistoryItem(${item.id}, '${itemName}')">${itemName}.gif</div>
          <div class="history-date">${item.date || 'Saved'}</div>
          <select class="folder-select" onchange="moveItemFolder(${item.id}, this.value)">

        </div>
        <div class="history-actions" style="display:flex; gap:4px;">
          <button class="history-dl-btn" aria-label="Download" onclick="downloadFromHistory(${item.id})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
          <button class="history-del-btn" aria-label="Delete" onclick="deleteFromHistory(${item.id})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>`;
      grid.appendChild(card);
    }

  function filterHistoryView() { loadHistory(); }

  async function moveItemFolder(id, newFolder) {
    if (!db) await openDB();
    const tx = db.transaction('gifs', 'readwrite');
    const store = tx.objectStore('gifs');
    store.get(id).onsuccess = e => {
      const data = e.target.result;
      if (data) { data.folder = newFolder; store.put(data); loadHistory(); }
    };

  async function renameHistoryItem(id, currentName) {

    if (!db) await openDB();
    const tx = db.transaction('gifs', 'readwrite');
    const store = tx.objectStore('gifs');
    store.get(id).onsuccess = e => {
      const data = e.target.result;
      if (data) { data.name = clean; store.put(data); loadHistory(); }
    };
  }

  async function downloadFromHistory(id) {
    if (!db) return;
    const tx = db.transaction('gifs', 'readonly');
    const req = tx.objectStore('gifs').get(id);
    req.onsuccess = () => {
      if (!req.result) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(req.result.blob);
      a.download = (req.result.name || 'sticker') + '.gif';
      a.click();

  async function deleteFromHistory(id) {
    if (!db) return;
    const tx = db.transaction('gifs', 'readwrite');
    tx.objectStore('gifs').delete(id);
    tx.oncomplete = () => loadHistory();
  }

  async function clearCurrentFolderOrHistory() {
    if (!confirm(`Clear all items in view (${currentFolderView})?`)) return;
    if (!db) await openDB();
    const tx = db.transaction('gifs', 'readwrite');
    const store = tx.objectStore('gifs');
    store.getAll().onsuccess = async e => {
      const items = e.target.result;
      for (const item of items) {
        if (currentFolderView === 'All' || item.folder === currentFolderView) {
          store.delete(item.id);
        }
      }
      loadHistory();
    };
  }

  function removeSlot(id) {

  const autoAddedNext = {};

  function previewSticker(id) {
    const rawUrl = document.getElementById('url-' + id).value.trim();
    const img = document.getElementById('preview-' + id);
    const ph = document.getElementById('placeholder-' + id);
    const convertBtn = document.getElementById('convert-btn-' + id);
    const status = document.getElementById('status-' + id);
    const previewSrc = (rawUrl === SAMPLE_FAKE_URL || (typeof sampleSlots !== 'undefined' && sampleSlots[id])) ? SAMPLE_REAL_URL : rawUrl;
    
    if (rawUrl && rawUrl.includes('awebp')) {
      img.src = previewSrc;
      img.style.display = 'block';
      ph.style.display = 'none';
      img.onerror = () => { img.style.display = 'none'; ph.style.display = 'flex'; };
      if (status) { status.textContent = ''; status.style.color = ''; }
      if (convertBtn && !gifBlobs[id]) convertBtn.style.display = 'inline-flex';
      maybeAutoAddSlot(id);
    } else {
      img.style.display = 'none';
      ph.style.display = 'flex';
      if (convertBtn) convertBtn.style.display = 'none';
      if (status) {
        status.textContent = '';
        status.style.color = '';
      }
    }
  }

  function maybeAutoAddSlot(id) {
    if (autoAddedNext[id]) return;
    const slots = document.querySelectorAll('.slot');
    const lastSlot = slots[slots.length - 1];
    if (lastSlot && lastSlot.id === 'slot-' + id) {
      autoAddedNext[id] = true;
      addSlot();
    }

  function updateZipBtn() {
    const count = Object.keys(gifBlobs).length;
    document.getElementById('dl-zip-btn').style.display = count > 1 ? 'inline-flex' : 'none';
  }

  const supportsImageDecoder = typeof window.ImageDecoder !== 'undefined';
  let xmuxReadyPromise = null;

  function loadWebpxmuxFallback() {
    if (xmuxReadyPromise) return xmuxReadyPromise;
    xmuxReadyPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'vendor/webpxmux.min.js';
      script.onload = () => {
        try {
          const xMux = window.WebPXMux('vendor/webpxmux.wasm');
          xMux.waitRuntime().then(() => resolve(xMux)).catch(reject);
        } catch (e) { reject(e); }
      };
      script.onerror = () => reject(new Error('Could not load decoder.'));
      document.head.appendChild(script);
    });
    return xmuxReadyPromise;
  }

  let gifsicleReadyPromise = null;
  function loadGifsicle() {
    if (!gifsicleReadyPromise) {
      gifsicleReadyPromise = import('/vendor/gifsicle.min.js').then(m => m.default);
    }
    return gifsicleReadyPromise;
  }

  function framesToImageData(frame, width, height) {
    const imgData = new ImageData(width, height);
    const out = imgData.data;
    const px = frame.rgba;
    for (let i = 0; i < px.length; i++) {
      const v = px[i];
      const o = i * 4;
      out[o] = (v >>> 24) & 0xFF;
      out[o + 1] = (v >>> 16) & 0xFF;
      out[o + 2] = (v >>> 8) & 0xFF;
      out[o + 3] = v & 0xFF;
    }
    return imgData;
  }

  const convertingSlots = {};

  async function convertSlot(id) {
    if (convertingSlots[id]) return;
    const url = document.getElementById('url-' + id).value.trim();
    if (!url) return;
    convertingSlots[id] = true;

    const status = document.getElementById('status-' + id);
    const pct = document.getElementById('pct-' + id);
    const barWrap = document.getElementById('bar-wrap-' + id);
    const bar = document.getElementById('bar-' + id);
    const dlBtn = document.getElementById('dl-btn-' + id);
    const convertBtn = document.getElementById('convert-btn-' + id);

    const setP = (p) => {
      bar.style.width = p + '%';
      pct.textContent = Math.round(p) + '%';
    };

    if (convertBtn) convertBtn.style.display = 'none';
    barWrap.style.display = 'block';
    status.textContent = 'fetching...';
    setP(0);

    const done = (ok) => {
      convertingSlots[id] = false;
      if (!ok && convertBtn) convertBtn.style.display = 'inline-flex';
    };

    return new Promise(async (resolve) => {
      try {
        const resolvedUrl = (url === SAMPLE_FAKE_URL || (typeof sampleSlots !== 'undefined' && sampleSlots[id])) ? SAMPLE_REAL_URL : url;
        const isSameOrigin = resolvedUrl.startsWith(window.location.origin);
        const fetchUrl = isSameOrigin ? resolvedUrl : `${PROXY}?url=${encodeURIComponent(resolvedUrl)}`;
        const res = await fetch(fetchUrl);
        const blob = await res.blob();
        const buf = await blob.arrayBuffer();

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const gif = new GIF({ workers: 4, quality: 10, workerScript: 'gif.worker.js' });

        if (supportsImageDecoder) {
          const decoder = new ImageDecoder({ data: buf, type: 'image/webp' });
          await decoder.tracks.ready;
          const frameCount = decoder.tracks.selectedTrack.frameCount;
          status.textContent = `encoding ${frameCount} frames...`;

          for (let i = 0; i < frameCount; i++) {
            const { image } = await decoder.decode({ frameIndex: i });
            canvas.width = image.codedWidth;
            canvas.height = image.codedHeight;
            
            // CLEAR CANVAS FULLY TO PREVENT BLACK BACKGROUND ON TRANSPARENT STICKERS
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 0, 0);

            const delayMs = image.duration ? image.duration / 1000 : 1000 / 15;
            gif.addFrame(canvas, { copy: true, delay: delayMs });
            image.close();
            setP((i + 1) / frameCount * 70);
          }
        } else {
          status.textContent = 'loading compatibility decoder...';
          const xMux = await loadWebpxmuxFallback();
          status.textContent = 'decoding...';
          const decoded = await xMux.decodeFrames(new Uint8Array(buf));
          const frameCount = decoded.frameCount;
          canvas.width = decoded.width;
          canvas.height = decoded.height;
          status.textContent = `encoding ${frameCount} frames...`;

          for (let i = 0; i < frameCount; i++) {
            const frame = decoded.frames[i];
            const imgData = framesToImageData(frame, decoded.width, decoded.height);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.putImageData(imgData, 0, 0);

            const delayMs = frame.duration || (1000 / 15);
            gif.addFrame(canvas, { copy: true, delay: delayMs });
            setP((i + 1) / frameCount * 70);
          }
        }

        gif.on('progress', p => { setP(70 + p * 15); status.textContent = 'rendering...'; });

        gif.on('finished', async result => {
          setP(85);
          status.textContent = 'compressing...';

          let finalBlob = result;
          try {
            const gifsicle = await loadGifsicle();
            const outFiles = await gifsicle.run({
              input: [{ file: result, name: 'in.gif' }],
              command: ['-O2 --lossy=40 in.gif -o /out/out.gif']
            });
            if (outFiles && outFiles[0] && outFiles[0].size > 0) {
              finalBlob = outFiles[0];
            }
          } catch (e) {
            console.warn('GIF compression skipped:', e);
          }

          setP(100);
          const savedPct = result.size > 0 ? Math.round((1 - finalBlob.size / result.size) * 100) : 0;
          status.textContent = savedPct > 0 ? `done! (${savedPct}% smaller)` : 'done!';
          const gifName = document.getElementById('name-display-' + id).textContent;
          gifBlobs[id] = { blob: finalBlob, name: gifName };
          dlBtn.style.display = 'inline-flex';
          updateZipBtn();
          saveToHistory(finalBlob, gifName);
          incrementCounter();
          done(true);
          resolve();
        });

        gif.render();
      } catch (err) {
        status.textContent = 'error: ' + err.message;
        lastErrors[id] = { url, message: err.message };
        done(false);
        resolve();
      }
    });
  }

  function downloadSingle(id) {
    const entry = gifBlobs[id];
    if (!entry) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(entry.blob);
    a.download = entry.name + '.gif';
    a.click();
  }

  async function convertAll() {
    const slots = document.querySelectorAll('.slot');
    const zipBtn = document.getElementById('dl-zip-btn');
    if (zipBtn) { zipBtn.disabled = true; zipBtn.style.opacity = '0.4'; zipBtn.style.pointerEvents = 'none'; }
    for (const slot of slots) {
      const id = parseInt(slot.id.replace('slot-', ''));
      const url = document.getElementById('url-' + id).value.trim();
      if (url && !gifBlobs[id]) await convertSlot(id);
    }
    if (zipBtn) { zipBtn.disabled = false; zipBtn.style.opacity = ''; zipBtn.style.pointerEvents = ''; }
    updateZipBtn();
  }

  async function downloadZip() {
    const entries = Object.entries(gifBlobs);
    if (!entries.length) return;
    const zip = new JSZip();
    const nameCounts = {};
    for (const [id, entry] of entries) {
      let filename = (entry.name || 'sticker').trim();
      if (!filename) filename = 'sticker';
      if (nameCounts[filename] === undefined) {
        nameCounts[filename] = 0;
      } else {
        nameCounts[filename]++;
        filename = filename + '_' + nameCounts[filename];
      }
      zip.file(filename + '.gif', entry.blob);
    }
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = 'stickers.zip';
    a.click();
  }
</script>
</body>
</html>
